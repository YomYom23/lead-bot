[project]
name = "lead-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # The web form now; the call-control endpoints and the live call WebSocket in later phases.
  "fastapi[standard]>=0.115,<0.121",
  # Python's zoneinfo needs a timezone database, and Windows doesn't ship one. Calling hours
  # depend on it, so a missing database must be an install error, not a runtime surprise.
  "tzdata>=2026.4",
]

[dependency-groups]
# httpx is what fastapi.testclient needs.
dev = ["pytest", "mypy", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_bot"]

# Lets a bare `uv run fastapi dev` find the app, which lives at src/lead_bot/main.py.
[tool.fastapi]
entrypoint = "lead_bot.main:app"

[tool.mypy]
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
